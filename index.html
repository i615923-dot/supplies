<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판촉비품 관리</title>
<style>
:root{--ac:#2f5f9e;--ac2:#4f81bd;--bg:#f3f5f8;--card:#fff;--line:#dde3ec;--tx:#1d2733;--mut:#6b7788;--ok:#1f8a4c;--warn:#c77700;--bad:#c62f2f;--soft:#eaf1fb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
header{background:var(--ac);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0;flex:1;font-weight:700}
header .who{font-size:12px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:12px}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:46px;z-index:19}
nav button{flex:1 0 auto;border:0;background:none;padding:12px 14px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
nav .bd{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;background:var(--bad);color:#fff;border-radius:9px;font-size:11px;line-height:18px;text-align:center}
main{padding:12px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-weight:400;color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ac);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-weight:600}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.gray{background:#e6ebf2;color:var(--tx)}
.btn.red{background:var(--bad)}
.btn.green{background:var(--ok)}
.btn.line{background:#fff;color:var(--ac);border:1px solid var(--ac)}
.btn:disabled{opacity:.5}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;white-space:nowrap;font-size:12px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:8px;background:#fff}
table.m{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
table.m th,table.m td{border-bottom:1px solid var(--line);border-right:1px solid #eef1f6;padding:6px 8px;text-align:center;background:#fff}
table.m thead th{position:sticky;top:0;background:var(--soft);z-index:3;font-size:12px}
table.m thead tr:nth-child(2) th{top:29px}
table.m td.nm,table.m th.nm{position:sticky;left:0;text-align:left;min-width:170px;max-width:210px;z-index:2;background:#fff;border-right:2px solid var(--line)}
table.m thead th.nm{background:var(--soft);z-index:4}
table.m tr.cat td{background:#f6f8fb;font-weight:700;text-align:left;position:sticky;left:0}
table.m td.tot{font-weight:700;background:#fafbfd}
table.m td.z{color:#c3cad6}
table.m td.me,table.m th.me{background:#fff8e6}
table.m tbody tr.it{cursor:pointer}
table.m tbody tr.it:hover td{background:#f2f7ff}
table.m tfoot td{position:sticky;bottom:0;background:var(--soft);font-weight:700;z-index:2}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:7px;background:#e9edf3}
.nm small{display:block;color:var(--mut);font-size:11px;margin-left:41px}
.item{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;background:#fff}
.item .top{display:flex;gap:10px;align-items:flex-start}
.item .top img{width:54px;height:54px;object-fit:cover;border-radius:8px;background:#e9edf3;flex:none}
.item .t{font-weight:700}
.item .d{font-size:12px;color:var(--mut);margin-top:2px;line-height:1.5}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-right:4px}
.tag.p{background:#fff1d6;color:var(--warn)}.tag.d{background:#dff3e6;color:var(--ok)}.tag.r{background:#fde4e4;color:var(--bad)}.tag.c{background:#e8ebf0;color:var(--mut)}.tag.l{background:#e4eefc;color:var(--ac)}
.empty{color:var(--mut);text-align:center;padding:18px 0;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(15,25,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:14px}}
.md h3{margin:0 0 6px;font-size:16px}
.md .photo{width:100%;max-height:300px;object-fit:contain;background:#f0f3f8;border-radius:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:8px 0}
.kv div{background:var(--soft);border-radius:7px;padding:6px 8px;font-size:12px}
.kv b{display:block;font-size:15px}
.note{background:#fff8e6;border:1px solid #f3dfa5;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.55;color:#6c5300}
.note.blue{background:var(--soft);border-color:#c9daf0;color:#27466f}
#login{max-width:360px;margin:12vh auto 0;padding:0 16px}
#login .card{padding:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:99;font-size:13px;max-width:90vw;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}
pre.rep{white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:'Malgun Gothic',monospace;font-size:13px;line-height:1.7;margin:0}
table.r{border-collapse:collapse;font-size:13px}
table.r th,table.r td{border:1px solid #889;padding:4px 10px;text-align:center}
table.r th{background:#eef2f8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h2 style="font-size:18px;margin-bottom:4px">판촉비품 관리</h2>
    <div style="color:var(--mut);font-size:12px;margin-bottom:6px">무학 영업지점 판촉비품 현황 · 이동 · 손망실</div>
    <label>지점</label>
    <select id="lg-loc">
      <option>창원</option><option>진주</option><option>김해</option><option>한려</option><option>북부산</option><option>남부산</option><option>울산</option><option>서울</option><option>대구물류</option><option>관리자</option>
    </select>
    <label>비밀번호</label>
    <input type="password" id="lg-pw" autocomplete="current-password" inputmode="text">
    <button class="btn" id="lg-go" style="width:100%;margin-top:14px;padding:11px">로그인</button>
    <div id="lg-err" style="color:var(--bad);font-size:12px;margin-top:8px;min-height:16px"></div>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <h1>판촉비품 관리</h1>
    <span class="who" id="who"></span>
    <button id="btn-refresh">새로고침</button>
    <button id="btn-logout">로그아웃</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
'use strict';
const SB_URL='https://wsktpndhlytjbnunbvxp.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indza3RwbmRobHl0amJudW5idnhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMzEyNjMsImV4cCI6MjA5NzkwNzI2M30.RdQM6ovQMoq70h5r0zY-EqArzXfia-P_mZGcFTQoU_c';
const ADMIN='관리자';
const ERR={AUTH_FAIL:'지점 또는 비밀번호가 맞지 않습니다.',STOCK_SHORT:'보유 수량이 부족합니다.',FORBIDDEN:'권한이 없습니다.',NOT_PENDING:'이미 처리된 건입니다. 새로고침해 주세요.',REASON_REQUIRED:'사유를 입력해 주세요.',PHOTO_REQUIRED:'사진을 첨부해 주세요.',PHOTO_TOO_BIG:'사진 용량이 너무 큽니다. 다른 사진을 선택해 주세요.',DUP_NAME:'이미 같은 이름의 품목이 있습니다.',SAME_LOC:'보내는 곳과 받는 곳이 같습니다.',BAD_QTY:'수량을 확인해 주세요.',OVER_RETURN:'반납 수량이 대여 잔량보다 많습니다.',NO_LOAN:'대여 건을 찾을 수 없습니다.',NAME_REQUIRED:'품목명을 입력해 주세요.',BAD_CAT:'분류를 선택해 주세요.',PW_SHORT:'비밀번호는 3자 이상이어야 합니다.',NOT_FOUND:'대상을 찾을 수 없습니다.',BAD_LOC:'보관처를 확인해 주세요.'};
let ME=null,S=null,STK={},PH={},ITM={},tab='stock',fCat=0,fQ='',fMine=false,busy=false,rep=null,repYm='',logs=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ko-KR');
const isAdmin=()=>ME&&ME.loc===ADMIN;
const kstDate=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10);
const kstYm=()=>kstDate().slice(0,7);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function errText(e){const m=String(e&&e.message||e);if(/Failed to fetch|NetworkError|Load failed/i.test(m))return '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요. (계속되면 Supabase 일시중지 여부 확인)';const code=m.split(':')[0].trim();if(code==='PENDING')return '대기 중인 건이 '+m.split(':')[1]+'건 있습니다. 승인 또는 취소 후 월 확정/보고서 생성이 가능합니다.';return ERR[code]||m}

async function rpc(fn,args){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}
  if(!r.ok)throw new Error((j&&j.message)||t||('HTTP '+r.status));
  return j;
}
const call=(fn,a)=>rpc(fn,Object.assign({p_loc:ME.loc,p_pw:ME.pw},a||{}));
async function act(fn,a,okMsg){
  if(busy)return false;busy=true;
  try{const r=await call(fn,a);if(okMsg)toast(okMsg);await load();return r===null?true:r}
  catch(e){toast(errText(e));return false}
  finally{busy=false}
}

/* ---------- 데이터 ---------- */
async function load(){
  S=await call('sup_state');
  STK={};S.stock.forEach(([i,l,q])=>STK[i+'|'+l]=q);
  ITM={};S.items.forEach(i=>ITM[i.id]=i);
  if(S.items.some(i=>i.has_photo)&&!load.ph){load.ph=1;call('sup_item_photos').then(p=>{PH=p;load.ph=0;if(!document.querySelector('.ov'))render()}).catch(()=>{load.ph=0})}
  render();
}
const q=(i,l)=>STK[i+'|'+l]||0;
const total=i=>S.locs.reduce((a,l)=>a+q(i,l.code),0);
const act_items=()=>S.items.filter(i=>i.active);
const imgSrc=i=>i.has_photo&&PH[i.id]?PH[i.id]:'photos/'+i.cat_no+'-'+i.item_no+'.jpg';
const PHOLD="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" fill="#e9edf3"/><text x="30" y="36" font-size="11" text-anchor="middle" fill="#9aa5b5">사진없음</text></svg>');
const img=(i,c)=>`<img class="${c||'thumb'}" loading="lazy" src="${esc(imgSrc(i))}" onerror="this.onerror=null;this.src='${PHOLD}'">`;
const myLocs=()=>isAdmin()?S.locs.map(l=>l.code):[ME.loc];
const nameOf=id=>ITM[id]?ITM[id].name:'#'+id;

/* ---------- 로그인 ---------- */
$('#lg-go').onclick=async()=>{
  const loc=$('#lg-loc').value,pw=$('#lg-pw').value;$('#lg-err').textContent='';
  if(!pw){$('#lg-err').textContent='비밀번호를 입력해 주세요.';return}
  $('#lg-go').disabled=true;
  try{await rpc('sup_login',{p_loc:loc,p_pw:pw});ME={loc,pw};try{sessionStorage.setItem('sup_me',JSON.stringify(ME))}catch(e){}
    $('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=loc;tab='stock';await load()}
  catch(e){$('#lg-err').textContent=errText(e)}
  $('#lg-go').disabled=false;
};
$('#lg-pw').onkeydown=e=>{if(e.key==='Enter')$('#lg-go').click()};
$('#btn-logout').onclick=()=>{try{sessionStorage.removeItem('sup_me')}catch(e){}location.reload()};
$('#btn-refresh').onclick=async()=>{try{await load();toast('새로고침 완료')}catch(e){toast(errText(e))}};
(async function(){try{const m=JSON.parse(sessionStorage.getItem('sup_me')||'null');if(m){ME=m;await rpc('sup_login',{p_loc:m.loc,p_pw:m.pw});$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=m.loc;await load()}}catch(e){ME=null}})();
setInterval(()=>{if(ME&&!document.hidden&&!document.querySelector('.ov')&&!busy)load().catch(()=>{})},60000);

/* ---------- 탭 ---------- */
function pendCounts(){
  const mv=S.moves.filter(m=>m.status==='pending'),ls=S.losses.filter(l=>l.status==='pending');
  const mine=isAdmin()?mv.length:mv.filter(m=>m.to_loc===ME.loc).length;
  const lmine=isAdmin()?ls.length:0;
  return{mv:mine,ls:lmine,allMv:mv.length,allLs:ls.length}
}
function render(){
  if(!S)return;
  const pc=pendCounts();
  const tabs=[['stock','현황',0],['move','이동·대여',pc.mv],['loss','손망실',pc.ls],['new','신규 등록',0]];
  if(isAdmin()){tabs.push(['month','월 확정·보고서',0],['admin','관리',0])}
  $('#nav').innerHTML=tabs.map(([k,n,b])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${n}${b?`<span class="bd">${b}</span>`:''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0);if(tab==='admin'&&!logs)loadLogs()});
  const f={stock:vStock,move:vMove,loss:vLoss,new:vNew,month:vMonth,admin:vAdmin}[tab];
  const sc=$('#main').querySelector('.tbl-wrap');const sl=sc?[sc.scrollLeft,sc.scrollTop]:null;
  const act=document.activeElement&&document.activeElement.id==='f-q'?document.activeElement.selectionStart:null;
  $('#main').innerHTML=f();bind();
  if(sl){const n=$('#main').querySelector('.tbl-wrap');if(n){n.scrollLeft=sl[0];n.scrollTop=sl[1]}}
  if(act!==null){const el=$('#f-q');if(el){el.focus();el.setSelectionRange(act,act)}}
}

/* ---------- 현황 ---------- */
function matrix(opts){
  opts=opts||{};
  const get=opts.get||q;
  const locs=S.locs,grp=[];
  locs.forEach(l=>{const g=grp.length&&grp[grp.length-1];if(g&&g.n===l.grp)g.c++;else grp.push({n:l.grp,c:1})});
  const cats=[...new Set(act_items().map(i=>i.cat_no))].sort((a,b)=>a-b);
  const items=act_items().filter(i=>(!fCat||i.cat_no===fCat)&&(!fQ||i.name.replace(/\s/g,'').toLowerCase().includes(fQ.replace(/\s/g,'').toLowerCase()))&&(!fMine||get(i.id,ME.loc)>0));
  let h=`<table class="m"><thead><tr><th class="nm" rowspan="2">품목</th><th rowspan="2">합계</th>`+grp.map(g=>`<th colspan="${g.c}">${esc(g.n)}</th>`).join('')+`</tr><tr>`+locs.map(l=>`<th class="${l.code===ME.loc?'me':''}">${esc(l.code)}</th>`).join('')+`</tr></thead><tbody>`;
  const sums={};locs.forEach(l=>sums[l.code]=0);let all=0;
  cats.forEach(c=>{const its=items.filter(i=>i.cat_no===c);if(!its.length)return;
    h+=`<tr class="cat"><td colspan="${locs.length+2}">${c}. ${esc(its[0].cat_name)}</td></tr>`;
    its.forEach(i=>{const t=locs.reduce((a,l)=>a+get(i.id,l.code),0);all+=t;
      h+=`<tr class="it" data-id="${i.id}"><td class="nm">${img(i)}${esc(i.name)}${i.note?`<small>${esc(i.note)}</small>`:''}</td><td class="tot">${fmt(t)}</td>`+locs.map(l=>{const v=get(i.id,l.code);sums[l.code]+=v;return `<td class="${v?'':'z'} ${l.code===ME.loc?'me':''}">${v?fmt(v):'·'}</td>`}).join('')+`</tr>`});
  });
  h+=`</tbody><tfoot><tr><td class="nm" style="background:var(--soft)">합계 (${items.length}종)</td><td>${fmt(all)}</td>`+locs.map(l=>`<td>${fmt(sums[l.code])}</td>`).join('')+`</tr></tfoot></table>`;
  return h;
}
function vStock(){
  const cats=[...new Map(act_items().map(i=>[i.cat_no,i.cat_name]))];
  return `<div class="card"><div class="row" style="margin-bottom:8px">
    <input type="text" id="f-q" placeholder="품목 검색" value="${esc(fQ)}" style="flex:1;min-width:140px">
    ${isAdmin()?'':`<label style="margin:0;display:flex;gap:5px;align-items:center;color:var(--tx)"><input type="checkbox" id="f-mine" ${fMine?'checked':''}>우리 지점 보유만</label>`}
  </div>
  <div class="chips"><button class="chip ${fCat?'':'on'}" data-cat="0">전체</button>${cats.map(([n,t])=>`<button class="chip ${fCat===n?'on':''}" data-cat="${n}">${n}.${esc(t)}</button>`).join('')}</div>
  <div class="empty hide"></div></div>
  <div class="tbl-wrap">${matrix()}</div>
  <div style="color:var(--mut);font-size:12px;margin-top:8px">품목을 누르면 사진·보관처별 수량과 이동/손망실 신고 메뉴가 열립니다. (단위: EA)</div>`;
}

/* ---------- 모달 ---------- */
function modal(html,onMount){
  closeModal();
  const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md">${html}</div>`;
  o.addEventListener('mousedown',e=>{if(e.target===o)closeModal()});
  document.body.appendChild(o);if(onMount)onMount(o.querySelector('.md'));
}
function closeModal(){document.querySelectorAll('.ov').forEach(o=>o.remove())}
function itemModal(id){
  const i=ITM[id];const rows=S.locs.filter(l=>q(id,l.code)>0);
  const mine=isAdmin()?total(id):q(id,ME.loc);
  modal(`${img(i,'photo')}<h3 style="margin-top:10px">${esc(i.name)}</h3>
   <div style="color:var(--mut);font-size:12px">${i.cat_no}-${i.item_no} · ${esc(i.cat_name)}${i.note?' · '+esc(i.note):''}</div>
   <div class="kv"><div>합계<b>${fmt(total(id))}</b></div>${rows.map(l=>`<div>${esc(l.code)}<b>${fmt(q(id,l.code))}</b></div>`).join('')}</div>
   <div class="row" style="margin-top:6px">
    ${mine>0?`<button class="btn" data-a="move">이동·대여</button><button class="btn line" data-a="loss">손망실 신고</button>`:''}

async function compress(file,max,qual){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  let out=c.toDataURL('image/jpeg',qual);if(out.length>600000)out=c.toDataURL('image/jpeg',.5);return out;
}

   ${pc.allMv+pc.allLs?`<div class="note" style="margin-top:10px">⚠ 대기 중인 건이 있어 보고서를 만들 수 없습니다. 이동 대기 <b>${pc.allMv}</b>건, 손망실 대기 <b>${pc.allLs}</b>건을 승인 또는 취소해 주세요.</div>`:''}
   <div style="color:var(--mut);font-size:12px;margin-top:8px">확정 월: ${S.months.length?S.months.join(', '):'없음'} · 확정하면 그 시점의 지점별 수량이 월 기록으로 저장됩니다.</div></div>
   <div id="rep-area">${rep?reportHTML():''}</div>`;
}
function monthLabel(ym){return (+ym.slice(5))+'월'}
function sumBy(list,f){const m=new Map();list.forEach(x=>{const k=f(x);m.set(k,(m.get(k)||0)+x.qty)});return m}
function reportText(r){
  const ml=monthLabel(r.ym),L=[];
  const nw=r.new||[],ls=r.loss||[];
  const nwN=sumBy(nw,x=>x.name),lsN=sumBy(ls,x=>x.name);
  const nwTxt=nw.length?`${nwN.size}종 ${fmt(nw.reduce((a,x)=>a+x.qty,0))}개 (`+nw.map(x=>`${x.loc} ${x.name} ${fmt(x.qty)}개`).join(', ')+')':'없음';
  const lsTxt=ls.length?`${lsN.size}종 `+[...lsN].map(([n,q])=>`${n} ${fmt(q)}개`).join(', '):'없음';
  L.push(`1. ${ml} 판촉비품 관리 결과`,' 가. 관리 품목 및 수량',`   1) 기존 등록 : ${r.prev_kinds!=null?r.prev_kinds+'종 '+fmt(r.prev_qty)+'개':'-'}`,`   2) 신규 등록 : ${nwTxt}`,`   3) 손  망  실 : ${lsTxt}`);
  if(r.adjust)L.push(`   ※ 실사 조정 : ${r.adjust>0?'+':''}${fmt(r.adjust)}개`);
  L.push(`   4) 합       계 : ${r.kinds}종 ${fmt(r.qty)}개`,' 나. 종류별 품목 수량 현황 (표 참조)','','2. 공유 비품 이동 현황 (추적 관리)');
  const mv=r.moves||[];
  if(mv.length){const ab='가나다라마바사아자차카타파하';mv.forEach((m,i)=>{
    const t=m.kind==='return'?`${m.from} ${m.name} ${fmt(m.qty)}개 ▶ ${m.to} 반납`:`${m.from} ${m.name} ${fmt(m.qty)}개 ▶ ${m.to} ${m.kind==='loan'?'대여':'이동'}`;
    L.push(` ${ab[i]||'-'}. ${t}${m.memo?' ('+m.memo+')':''}`)})}else L.push(' 해당 없음');
  const ol=r.open_loans||[];
  if(ol.length){L.push('','3. 대여 중 (반납 전)');ol.forEach(o=>L.push(` - ${o.from} ${o.name} ${fmt(o.qty)}개 ▶ ${o.to} 대여 중${o.due?' (반납예정 '+o.due+')':''}`))}
  return L.join('\n');
}
function catTableHTML(r){
  const c=r.cats||[],h=Math.ceil(c.length/2);let t=`<table class="r"><tr><th>일련</th><th>구 분</th><th>수 량</th><th>일련</th><th>구 분</th><th>수량</th></tr>`;
  for(let i=0;i<h;i++){const a=c[i],b=c[i+h];t+=`<tr><td>${a.cat_no}</td><td>${esc(a.cat_name)}</td><td>${fmt(a.qty)}</td>`+(b?`<td>${b.cat_no}</td><td>${esc(b.cat_name)}</td><td>${fmt(b.qty)}</td>`:`<td colspan="2">합계</td><td>${fmt(r.qty)}</td>`)+`</tr>`}
  if(c.length%2===0)t+=`<tr><td colspan="5">합계</td><td>${fmt(r.qty)}</td></tr>`;
  return t+'</table>';
}
function catTableTSV(r){
  const c=r.cats||[],h=Math.ceil(c.length/2);const L=['일련\t구분\t수량\t일련\t구분\t수량'];
  for(let i=0;i<h;i++){const a=c[i],b=c[i+h];L.push(`${a.cat_no}\t${a.cat_name}\t${a.qty}\t`+(b?`${b.cat_no}\t${b.cat_name}\t${b.qty}`:`\t합계\t${r.qty}`))}
  if(c.length%2===0)L.push(`\t\t\t\t합계\t${r.qty}`);return L.join('\n');
}
function reportHTML(){
  return `<div class="card"><h2>${monthLabel(rep.ym)} 보고서 <span class="sub">한글 2002 등에 붙여넣기</span></h2>
   <pre class="rep" id="rp-text">${esc(reportText(rep))}</pre>
   <div class="row" style="margin-top:8px"><button class="btn sm" data-cp="text">문안 복사</button></div>
   <h2 style="margin-top:16px">종류별 품목 수량 현황 <span class="sub">(단위 : ea)</span></h2>
   <div style="overflow:auto">${catTableHTML(rep)}</div>
   <div class="row" style="margin-top:8px"><button class="btn sm" data-cp="cat">표 복사 (탭 구분)</button><button class="btn sm line" data-cp="cathtml">표 복사 (서식 포함)</button></div>
   <h2 style="margin-top:16px">지점별 비품 집계표 <span class="sub">별첨용 · 확정 시점 수량</span></h2>
   <div class="row"><button class="btn sm" data-cp="matrix">집계표 복사 (탭 구분)</button></div></div>`;
}
async function copyText(t,html){
  try{if(html&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([t],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})})])}else await navigator.clipboard.writeText(t);toast('복사했습니다.')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사했습니다.')}catch(x){toast('복사에 실패했습니다.')}ta.remove()}
}
function matrixTSV(snap){
  const g={};snap.forEach(([i,l,v])=>g[i+'|'+l]=v);const locs=S.locs.map(l=>l.code);
  const L=['일련\t구분\t품목\t합계\t'+locs.join('\t')];
  act_items().forEach(i=>{const row=locs.map(l=>g[i.id+'|'+l]||0);L.push([i.cat_no+'-'+i.item_no,i.cat_name,i.name,row.reduce((a,b)=>a+b,0),...row.map(v=>v||'')].join('\t'))});
  return L.join('\n');
}

/* ---------- 관리 ---------- */
async function loadLogs(){try{logs=await call('sup_log_list',{p_limit:200});if(tab==='admin')render()}catch(e){toast(errText(e))}}
const actTxt={item_new:'신규 등록',item_edit:'품목 수정',adjust:'수량 조정',month_confirm:'월 확정',set_pw:'비번 변경',loss_reject:'손망실 반려',loss_cancel:'손망실 취소',move_reject:'이동 거절',move_cancel:'이동 취소'};
function actName(a){if(actTxt[a])return actTxt[a];const [k,s]=a.split(':');const m={move_create:'이동 등록',move_done:'이동 완료',loss_create:'손망실 신고',loss_done:'손망실 확정'}[k];return m?m+(s?'('+({perm:'영구',loan:'대여','return':'반납',loss:'손실',lost:'망실'}[s]||s)+')':''):a}
function vAdmin(){
  const br=S.locs.filter(l=>l.login);
  return `<div class="card"><h2>지점 비밀번호 변경</h2><div class="grid2" style="gap:10px">${br.map(l=>`<div class="item" style="margin:0"><b>${esc(l.code)}</b><div class="row" style="margin-top:6px;flex-wrap:nowrap"><input type="text" placeholder="새 비밀번호" data-pwin="${esc(l.code)}"><button class="btn sm" data-pw="${esc(l.code)}">변경</button></div></div>`).join('')}</div>
   <div class="row" style="margin-top:12px"><button class="btn line sm" id="pw-admin">관리자 비밀번호 변경</button></div></div>
  <div class="card"><h2>품목 관리 <span class="sub">이름·사진·메모 수정, 사용 중지</span></h2>
   ${S.items.map(i=>`<div class="item" style="margin-bottom:6px"><div class="top">${img(i,'')}<div style="flex:1"><div class="t">${i.cat_no}-${i.item_no} ${esc(i.name)} ${i.active?'':'<span class="tag c">사용중지</span>'}</div><div class="d">${esc(i.cat_name)} · 합계 ${fmt(total(i.id))}${i.note?' · '+esc(i.note):''}</div></div><button class="btn sm gray" data-edit="${i.id}">수정</button></div></div>`).join('')}</div>
  <div class="card"><h2>변경 이력 <span class="sub">최근 200건</span><button class="btn sm gray" id="lg-reload" style="margin-left:auto">새로고침</button></h2>
   ${logs?(logs.length?`<div class="tbl-wrap" style="max-height:420px"><table class="m"><thead><tr><th>시각</th><th>작업자</th><th>작업</th><th class="nm" style="position:static">품목</th><th>위치</th><th>증감</th><th>내용</th></tr></thead><tbody>${logs.map(x=>`<tr><td>${dt(x.at)}</td><td>${esc(x.actor)}</td><td>${esc(actName(x.action))}</td><td style="text-align:left">${esc(x.item_name||'')}</td><td>${esc(x.loc||'')}</td><td>${x.delta?(x.delta>0?'+':'')+fmt(x.delta):''}</td><td style="text-align:left">${esc(x.detail||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">이력 없음</div>'):'<div class="empty">불러오는 중…</div>'}</div>`;
}
function editForm(id){
  const i=ITM[id],ph={v:''};
  modal(`<h3>품목 수정</h3>${img(i,'photo')}
  <label>품목명</label><input type="text" id="ed-name" value="${esc(i.name)}" maxlength="60">
  <label>메모 (비고)</label><input type="text" id="ed-note" value="${esc(i.note||'')}" maxlength="60">
  ${photoField('ed-file')}<label style="display:flex;gap:6px;align-items:center;color:var(--tx)"><input type="checkbox" id="ed-clr"> 업로드 사진 삭제(기본 사진으로 되돌리기)</label>
  <label style="display:flex;gap:6px;align-items:center;color:var(--tx)"><input type="checkbox" id="ed-act" ${i.active?'checked':''}> 사용 중 (해제하면 목록에서 숨김)</label>
  <div class="row" style="margin-top:14px"><button class="btn" id="ed-ok">저장</button><button class="btn gray" id="ed-x">취소</button></div>`,m=>{
    photoBind(m,'ed-file',640,ph);m.querySelector('#ed-x').onclick=closeModal;
    m.querySelector('#ed-ok').onclick=async()=>{const ok=await act('sup_item_update',{p_id:id,p_name:m.querySelector('#ed-name').value,p_photo:ph.v||null,p_clear_photo:m.querySelector('#ed-clr').checked,p_active:m.querySelector('#ed-act').checked,p_note:m.querySelector('#ed-note').value},'저장했습니다.');if(ok){PH={};closeModal()}};
  });
}
function textPrompt(title,ph,cb){modal(`<h3>${esc(title)}</h3><input type="text" id="tp" placeholder="${esc(ph)}" maxlength="100"><div class="row" style="margin-top:14px"><button class="btn" id="tp-ok">확인</button><button class="btn gray" id="tp-x">취소</button></div>`,m=>{m.querySelector('#tp').focus();m.querySelector('#tp-x').onclick=closeModal;const go=()=>{const v=m.querySelector('#tp').value.trim();if(!v)return toast('내용을 입력해 주세요.');closeModal();cb(v)};m.querySelector('#tp-ok').onclick=go;m.querySelector('#tp').onkeydown=e=>{if(e.key==='Enter')go()}})}

/* ---------- 이벤트 바인딩 ---------- */
function bind(){
  const M=$('#main'),on=(s,f)=>{const e=M.querySelector(s);if(e)e.onclick=f};
  M.querySelectorAll('tr.it').forEach(r=>r.onclick=()=>itemModal(+r.dataset.id));
  M.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{fCat=+b.dataset.cat;render()});
  const fq=$('#f-q');if(fq)fq.oninput=e=>{fQ=e.target.value;render()};
  const fm=$('#f-mine');if(fm)fm.onchange=e=>{fMine=e.target.checked;render()};
  on('#mv-new',()=>moveForm(0));on('#ls-new',()=>lossForm(0));
  M.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const id=+b.dataset.id,a=b.dataset.mv;
    if(a==='return')return returnForm(id);
    if(a==='reject')return textPrompt('거절 사유','예) 수량이 다릅니다',v=>act('sup_move_resolve',{p_id:id,p_action:'reject',p_reason:v},'거절했습니다.'));
    if(a==='cancel'&&!confirm('이 건을 취소할까요?'))return;
    act('sup_move_resolve',{p_id:id,p_action:a,p_reason:null},a==='confirm'?'확인했습니다. 수량이 반영되었습니다.':'취소했습니다.')});
  M.querySelectorAll('[data-ls]').forEach(b=>b.onclick=async()=>{const id=+b.dataset.id,a=b.dataset.ls;
    if(a==='photo'){try{const p=await call('sup_loss_photo',{p_id:id});modal(`<h3>증빙 사진</h3>${p?`<img class="photo" src="${esc(p)}">`:'<div class="empty">사진이 없습니다.</div>'}<div class="row" style="margin-top:10px"><button class="btn gray" id="ph-x">닫기</button></div>`,m=>m.querySelector('#ph-x').onclick=closeModal)}catch(e){toast(errText(e))}return}
    if(a==='reject')return textPrompt('반려 사유','예) 사진 재확인 필요',v=>act('sup_loss_resolve',{p_id:id,p_action:'reject',p_reason:v},'반려했습니다. 사진은 삭제됩니다.'));
    if(a==='cancel'&&!confirm('신고를 취소할까요?'))return;
    if(a==='confirm'&&!confirm('확인하면 수량이 차감되고 첨부 사진이 삭제됩니다. 진행할까요?'))return;
    act('sup_loss_resolve',{p_id:id,p_action:a,p_reason:null},a==='confirm'?'확인했습니다. 수량 차감, 사진 삭제 완료.':'취소했습니다.')});
  // 신규 등록
  if($('#nw-ok')){const ph={v:''};photoBind(M,'nw-file',640,ph);
    $('#nw-cat').onchange=e=>$('#nw-newcat').classList.toggle('hide',e.target.value!=='0');
    $('#nw-ok').onclick=async()=>{const name=$('#nw-name').value.trim(),n=+$('#nw-qty').value,cat=+$('#nw-cat').value;
      if(!name)return toast('품목명을 입력해 주세요.');if(!(n>0))return toast('수량을 입력해 주세요.');if(!isAdmin()&&!ph.v)return toast('제품 사진을 첨부해 주세요.');
      if(!confirm(`"${name}" ${n}개를 ${isAdmin()?$('#nw-loc').value:ME.loc}에 등록할까요?\n(단가 3만원 이상 비품만 등록 대상입니다)`))return;
      const r=await act('sup_item_create',{p_cat_no:cat,p_cat_name:$('#nw-catname')?$('#nw-catname').value:null,p_name:name,p_qty:n,p_photo:ph.v||null,p_at:isAdmin()?$('#nw-loc').value:ME.loc},'등록했습니다.');
      if(r){PH={};tab='stock';render()}}}
  // 월 확정
  if($('#mo-ym')){$('#mo-ym').onchange=e=>{repYm=e.target.value;rep=null;render()};
    on('#mo-do',async()=>{const ym=$('#mo-ym').value;if(!ym)return toast('월을 선택해 주세요.');
      if(!confirm(`${monthLabel(ym)} 수량을 확정하고 보고서를 만들까요?${S.months.includes(ym)?'\n(이미 확정된 월입니다. 현재 수량으로 다시 저장됩니다)':''}`))return;
      try{rep=await call('sup_month_confirm',{p_ym:ym});repYm=ym;toast('월 확정 완료');await load()}catch(e){toast(errText(e))}});
    on('#mo-view',async()=>{try{const r=await call('sup_month_get',{p_ym:$('#mo-ym').value});if(r&&r.report&&r.report.ym){rep=r.report;rep._snap=r.snapshot;repYm=rep.ym;render()}else toast('보고서가 저장된 월이 아닙니다. "월 확정"을 눌러 생성해 주세요.')}catch(e){toast(errText(e))}});
    M.querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{const k=b.dataset.cp;
      if(k==='text')copyText(reportText(rep));
      else if(k==='cat')copyText(catTableTSV(rep));
      else if(k==='cathtml')copyText(catTableTSV(rep),catTableHTML(rep));
      else if(k==='matrix'){let snap=rep._snap;if(!snap){const r=await call('sup_month_get',{p_ym:rep.ym});snap=r&&r.snapshot}if(snap)copyText(matrixTSV(snap))}})}
  // 관리
  M.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{const t=b.dataset.pw,v=M.querySelector(`[data-pwin="${t}"]`).value.trim();if(v.length<3)return toast('비밀번호는 3자 이상입니다.');act('sup_set_pw',{p_target:t,p_new:v},t+' 비밀번호를 변경했습니다.').then(()=>{M.querySelector(`[data-pwin="${t}"]`)&&(M.querySelector(`[data-pwin="${t}"]`).value='')})});
  on('#pw-admin',()=>textPrompt('새 관리자 비밀번호','3자 이상',async v=>{if(v.length<3)return toast('3자 이상 입력해 주세요.');try{await call('sup_set_pw',{p_target:ADMIN,p_new:v});ME.pw=v;try{sessionStorage.setItem('sup_me',JSON.stringify(ME))}catch(e){}toast('관리자 비밀번호를 변경했습니다.')}catch(e){toast(errText(e))}}));
  M.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editForm(+b.dataset.edit));
  on('#lg-reload',loadLogs);
}
</script>
